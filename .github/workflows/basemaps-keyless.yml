name: Basemaps keyless

# "Keyless" is a behaviour, not a URL: a provider can start watermarking or gating tiles at
# HTTP 200 without notice. This re-verifies every @strata/map-controls basemap against the live
# hosts — weekly, on demand, and on any PR that touches the package.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "strata/packages/map-controls/**"
      - ".github/workflows/basemaps-keyless.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: strata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: strata/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @strata/map-controls
        run: pnpm --filter @strata/map-controls build

      # Exits non-zero if any basemap fails (each entry already gets one automatic retry for
      # slow volunteer hosts). A failure here means: look at the tile, then fix or drop the entry.
      - name: Verify every basemap is keyless (live)
        run: pnpm --filter @strata/map-controls verify:basemaps
